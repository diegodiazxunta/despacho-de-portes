<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho de portes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style id="css-base">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F0F2F5; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#E8ECF1;
  --ink:#141B25; --muted:#5A6473; --line:#D6DBE2; --line-strong:#B9C2CE;
  --header:#111922; --on-header:#F2F5F8;
  --brand:#0B4F8C; --brand-2:#1667AE; --on-brand:#FFFFFF;
  --signal:#F2B200; --signal-soft:#FFF4CC; --signal-ink:#4A3600;
  --ok:#1D7446; --ok-soft:#E0F1E7; --warn:#946000; --warn-soft:#FBF0D3; --err:#B3261E; --err-soft:#FBE3E1;
  --sea:#DBE5EF; --land:#F8FAFB; --land-line:#ADBACB; --grid:#CBD5E1;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D131B; --surface:#151E2A; --surface-2:#1A2533; --surface-3:#212E40;
    --ink:#E6ECF3; --muted:#9AA7B8; --line:#2A384B; --line-strong:#3A4B63;
    --header:#080C11; --on-header:#E6ECF3;
    --brand:#3E7FC4; --brand-2:#5A95D2; --on-brand:#FFFFFF;
    --signal:#F2B200; --signal-soft:#3A2E0A; --signal-ink:#FFE08A;
    --ok:#5CC48A; --ok-soft:#14301F; --warn:#E5B54F; --warn-soft:#33270F; --err:#F08A80; --err-soft:#3A1918;
    --sea:#0F1724; --land:#1B283B; --land-line:#3A4D6B; --grid:#1F2E44;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D131B; --surface:#151E2A; --surface-2:#1A2533; --surface-3:#212E40;
  --ink:#E6ECF3; --muted:#9AA7B8; --line:#2A384B; --line-strong:#3A4B63;
  --header:#080C11; --on-header:#E6ECF3;
  --brand:#3E7FC4; --brand-2:#5A95D2; --on-brand:#FFFFFF;
  --signal:#F2B200; --signal-soft:#3A2E0A; --signal-ink:#FFE08A;
  --ok:#5CC48A; --ok-soft:#14301F; --warn:#E5B54F; --warn-soft:#33270F; --err:#F08A80; --err-soft:#3A1918;
  --sea:#0F1724; --land:#1B283B; --land-line:#3A4D6B; --grid:#1F2E44;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* cabecera */
.top{display:flex;align-items:stretch;gap:20px;padding:0 18px;background:var(--header);color:var(--on-header);flex:0 0 auto;min-height:54px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--signal);display:grid;place-items:center;color:#111;font-family:var(--cond);font-weight:700;font-size:16px}
.brand b{font-family:var(--cond);font-weight:700;font-size:20px;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.7;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px}
.nav button{border:0;background:transparent;color:var(--on-header);opacity:.68;padding:0 13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{opacity:1}
.nav button[aria-current="page"]{opacity:1;border-bottom-color:var(--signal)}
.mode{display:flex;align-items:center;gap:8px;margin-left:auto}
.switch{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;color:var(--on-header);padding:5px 12px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;opacity:.75}
.switch button[aria-pressed="true"]{background:var(--signal);color:#111;opacity:1}
.save{font-size:12px;opacity:.75;display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:#7FD3A2}.save.local i{background:var(--signal)}.save.none i{background:#E58A80}

/* barra de días */
.days{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.days .nav-d{display:flex;gap:4px;align-items:center}
.days input[type=date]{border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;background:var(--surface)}
.strip{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px}
.day{flex:0 0 auto;width:62px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 4px 6px;text-align:center;cursor:pointer;position:relative}
.day:hover{border-color:var(--line-strong)}
.day .wd{font-size:11.5px;color:var(--muted);text-transform:lowercase}
.day .dn{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.05}
.day .ct{font-size:11.5px;color:var(--muted)}
.day .ct b{color:var(--ink)}
.day.sel{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day.sel .wd,.day.sel .ct,.day.sel .ct b{color:var(--on-brand)}
.day.today::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--signal)}
.day .rs{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%}
.rs.full{background:var(--err)}.rs.half{background:var(--signal)}
.day .pend{position:absolute;top:4px;left:5px;width:7px;height:7px;border-radius:2px;background:var(--warn)}

/* estructura */
.body{flex:1 1 auto;display:flex;min-height:0}
.left{width:350px;flex:0 0 350px;background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:14px}
.center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{overflow:auto;flex:1 1 auto;padding:18px 22px}
h1{font-family:var(--cond);font-weight:700;font-size:26px;margin:0 0 4px}
h2{font-family:var(--cond);font-weight:700;font-size:20px;margin:20px 0 8px}
h3{font-size:15px;font-weight:700;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 14px;max-width:80ch}
.note{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sub{display:flex;flex-direction:column;gap:4px}
.sub button{display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;background:transparent;text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;font-weight:600}
.sub button:hover{background:var(--surface-2)}
.sub button[aria-current="true"]{background:var(--surface-3);border-color:var(--line)}
.count{font-family:var(--cond);font-size:14px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 8px}

/* controles */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 60%,transparent)}
.btn.small{padding:3px 8px;font-size:13px}
.btn.icon{padding:5px 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input:not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.field textarea{min-height:54px;resize:vertical}
.wide{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
input[type=checkbox]{accent-color:var(--brand);width:auto}
.box{border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;margin-top:10px}
.info{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.msg{border-radius:8px;padding:8px 10px;font-size:13.5px;margin:6px 0}
.msg.err{background:var(--err-soft);color:var(--err)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg ul{margin:4px 0 0 18px;padding:0}
.search{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;width:100%;background:var(--surface)}

/* tablas, fichas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw td:first-child{min-width:150px}
tr.today-row td{background:color-mix(in srgb,var(--signal) 9%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.chip.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--line-strong)}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.card h4{margin:0 0 3px;font-size:15px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:20px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--cond);font-size:24px}
.stat span{font-size:12.5px;color:var(--muted)}

/* barras */
.bar{margin:6px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.bar .tr{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line)}
.bar .fl{height:100%;background:var(--brand);transition:width .25s}
.bar .fl.hi{background:var(--signal)}.bar .fl.over{background:var(--err)}

/* mapa */
.maptools{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.mapbox{position:relative;flex:1 1 auto;min-height:260px;background:var(--sea);overflow:hidden}
.mapbox svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mapbox svg.drag{cursor:grabbing}
.pin{cursor:pointer}.pin:hover .pb{filter:brightness(1.12)}
.ml{font-family:var(--font);font-weight:600;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;fill:var(--ink)}
.cl{fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;max-width:270px}
.legend .li{display:flex;align-items:center;gap:6px;margin:2px 0}
.pop{position:absolute;left:12px;top:12px;width:310px;max-width:calc(100% - 24px);max-height:calc(100% - 150px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13.5px}
.pop h4{margin:0 22px 6px 0;font-size:15px;display:flex;align-items:center;gap:8px}
.pop .x{position:absolute;right:6px;top:6px;border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:17px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(380px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h3{margin:0 0 6px;font-family:var(--cond);font-size:21px}
.modal input{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;background:var(--surface);margin:8px 0}
.dayflag{position:absolute;right:12px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;max-width:300px}

/* línea de tiempo */
.timeline{flex:0 0 auto;max-height:40%;overflow:auto;border-top:1px solid var(--line);background:var(--surface);padding:10px 14px}
.tl-axis{position:relative;height:18px;margin-left:150px;font-size:11.5px;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-row{display:flex;align-items:center;height:28px}
.tl-name{width:150px;flex:0 0 150px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;padding-right:8px}
.tl-track{position:relative;flex:1;height:18px;background:var(--surface-2);border-radius:5px;border:1px solid var(--line)}
.tl-midnight{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1px dashed var(--line-strong)}
.sg{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}
.t-conduccion{background:var(--brand)}.t-carga,.t-descarga{background:#D9822B}.t-pausa{background:#2E9E62}
.t-pernocta,.t-descanso{background:#7C4DBA}.t-espera{background:repeating-linear-gradient(45deg,var(--line-strong) 0 4px,transparent 4px 8px)}
.t-restriccion{background:repeating-linear-gradient(45deg,#C0392B 0 4px,#E9A79F 4px 8px)}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:6px 0 2px 150px}
.tl-legend span{display:flex;align-items:center;gap:5px}
.tl-legend i{width:14px;height:10px;border-radius:2px;display:inline-block}

@media (max-width:920px){
  .top{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .nav{order:3;width:100%;overflow-x:auto}.nav button{padding:8px 12px}
  .days{flex-wrap:wrap}.strip{flex:1 1 100%}
  .body{flex-direction:column}
  .left{width:auto;flex:0 0 auto;max-height:44%;border-right:0;border-bottom:1px solid var(--line)}
  .tl-axis,.tl-legend{margin-left:96px}.tl-name{width:96px;flex-basis:96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------------------------------------------------------
   Acceso con usuario y contraseña · gestión de usuarios
   --------------------------------------------------------------- */
.auth{flex:1 1 auto;display:grid;place-items:center;padding:24px;overflow:auto}
.auth-marco{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 36px rgba(0,0,0,.14)}
.auth-cab{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.auth-mark{width:36px;height:36px;border-radius:8px;background:var(--signal);display:grid;place-items:center;color:#111;font-family:var(--cond);font-weight:700;font-size:18px;flex:0 0 auto}
.auth-cab b{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.05;display:block}
.auth-cab small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-marco h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 4px}
.auth-marco .field{margin-top:11px}
.auth-marco .note{margin:0}
.auth-pie{margin-top:18px;justify-content:space-between}
.sesion{display:flex;align-items:center;gap:6px}
.hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--on-header);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)}
.tabla-u{margin:4px 0 6px}
.tabla-u th,.tabla-u td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
.tabla-u th{font-size:12.5px;color:var(--muted);font-weight:600}
.tabla-u .der{text-align:right;white-space:nowrap}
.tabla-u .der .btn{margin-left:6px}
.modal .field{margin:10px 0}
.modal .field input{margin:2px 0 0}
@media (max-width:720px){
  .tabla-u th:nth-child(2),.tabla-u td:nth-child(2){display:none}
  .tabla-u .der{white-space:normal}
}
button.hbtn:disabled{opacity:.5;cursor:default}
.auth-marco .msg{margin:10px 0 0}
.top{flex-wrap:wrap;row-gap:0}
.top .mode{min-height:54px}
.save.pend i{background:var(--signal)}
@media (max-width:1500px){.save span{display:none}.nav button{padding:0 10px}}
.tabla-wrap{overflow-x:auto;max-width:100%}
#map image{pointer-events:none}
.osm-attr{position:absolute;right:56px;bottom:8px;max-width:calc(100% - 360px);min-width:180px;text-align:right;background:rgba(255,255,255,.88);color:#333;border-radius:6px;padding:3px 7px;font-size:11px;line-height:1.35;pointer-events:auto}
.osm-attr a{color:#0B4F8C}
.osm-attr span{color:#555}
@media (max-width:720px){.osm-attr{right:8px;left:auto;top:8px;bottom:auto;max-width:calc(100% - 16px)}}
</style>
<style id="css-shell">/* Carcasa */
#sh-btn{position:fixed;left:12px;bottom:12px;z-index:40;border:1px solid rgba(255,255,255,.3);background:#111922;color:#fff;border-radius:999px;padding:6px 13px;font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.left,.scroll{padding-bottom:60px!important}
#sh-btn:hover{background:rgba(255,255,255,.2)}
#sh-btn:focus-visible,.sh-btn2:focus-visible,#sh-fondo :focus-visible{outline:2px solid #F2B200;outline-offset:2px}
#sh-fondo{position:fixed;inset:0;z-index:60;background:rgba(10,15,22,.55);display:grid;place-items:center;padding:16px;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#sh-fondo[hidden]{display:none}
.sh-panel{background:var(--surface,#fff);color:var(--ink,#141B25);border:1px solid var(--line,#D6DBE2);border-radius:12px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sh-cab{display:flex;align-items:center;justify-content:space-between}
.sh-panel h2{margin:0;font-size:20px}
.sh-panel h3{margin:0 0 6px;font-size:15px}
.sh-panel section{border-top:1px solid var(--line,#D6DBE2);padding-top:12px;margin-top:12px}
.sh-panel p{margin:0 0 8px}
.sh-nota{color:var(--muted,#5A6473);font-size:13px}
.sh-x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted,#5A6473);padding:2px 8px}
.sh-fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-fila input[type=text],.sh-fila select{border:1px solid var(--line-strong,#B9C2CE);background:var(--surface,#fff);color:inherit;border-radius:7px;padding:6px 9px;font:inherit;min-width:0}
.sh-fila input[type=text]{flex:1 1 150px}
.sh-btn2{border:1px solid var(--line-strong,#B9C2CE);background:var(--surface,#fff);color:var(--ink,#141B25);border-radius:8px;padding:6px 11px;font:600 14px/1.2 inherit;cursor:pointer;display:inline-block}
.sh-btn2:hover{background:var(--surface-2,#F6F7F9)}
.sh-pri{background:var(--brand,#0B4F8C);border-color:var(--brand,#0B4F8C);color:var(--on-brand,#fff)}
.sh-pri:hover{background:var(--brand-2,#1667AE)}
.sh-peli{color:var(--err,#B3261E);border-color:var(--err,#B3261E)}
.sh-msg{border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0;background:var(--surface-2,#F6F7F9)}
.sh-msg.ok{background:var(--ok-soft,#E0F1E7);color:var(--ok,#1D7446)}
.sh-msg.warn{background:var(--warn-soft,#FBF0D3);color:var(--warn,#946000)}
.sh-msg.err{background:var(--err-soft,#FBE3E1);color:var(--err,#B3261E)}
.sh-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:#141B25;color:#fff;border-radius:10px;padding:10px 14px;max-width:min(560px,calc(100vw - 24px));display:flex;gap:12px;align-items:flex-start;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.sh-toast button{border:0;background:transparent;color:#fff;font-size:20px;line-height:1;cursor:pointer}
@media (max-width:920px){#sh-btn{left:auto;right:10px;top:9px;bottom:auto;padding:5px 10px}#sh-btn .sh-long{display:none}.top{padding-right:92px!important}.left,.scroll{padding-bottom:14px!important}}
.sh-toast .sh-acc{font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.5);border-radius:7px;padding:3px 9px;white-space:nowrap}
.sh-btn2:disabled,.sh-fila select:disabled,.sh-fila input:disabled{opacity:.5;cursor:default}

  for (let lat = 35; lat <= 45; lat++) { const a = P({ lat, lon: -10.5 }), b = P({ lat, lon: 4.5 }); g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--grid)" stroke-width="${px * .8}"/>`; }
  }

  if (osm) g += capaOSM(vb, px);

    }
    daySvc(ui.day).forEach(s => {
      const loc = s.tipo === "recogida" ? s.origen : s.destino; if (!loc) return;
      const k = loc.lat.toFixed(3) + "," + loc.lon.toFixed(3), n = counts[k] = (counts[k] || 0) + 1, q = P(loc), off = (n - 1) * px * 13;
      const isSel = ui.sel === s.id, sc = px * (isSel ? 1.35 : 1.05), col = s.sub ? "#8A94A3" : MERC[s.mercancia].c;

      if (isSel) g += `<text class="ml" x="${q.x + off + px * 14}" y="${q.y - px * 18}" font-size="${px * 12}" stroke-width="${px * 3}">${s.tipo === "recogida" ? "Recogida · " + esc(s.origen.nombre) : esc(lab(s))}</text>`;

      r.stops.forEach(st => { if (st.tipo === "base") return; const q = P(st.p); g += `<circle cx="${q.x}" cy="${q.y}" r="${px * 8}" fill="${color}" stroke="#fff" stroke-width="${px * 1.6}"/><text x="${q.x}" y="${q.y + px * 4}" text-anchor="middle" font-size="${px * 10}" font-weight="700" fill="#fff">${st.tipo === "recogida" ? "R" : "E"}</text>`;

function fichaCliente(k) {

  const fut = svs.filter(s => dayNum(s.fecha) >= hoy).length, asg = svs.filter(s => state.asig[s.id]).length;

  svs.forEach(s => { const a = state.asig[s.id]; const r = a && allR[dayNum(s.fecha)] ? allR[dayNum(s.fecha)][a.camionId] : null; const x = r ? r.svc[s.id] : null; if (x) { conHora++; if (!x.tarde && !x.tardeCarga) enPlazo++; } const o = origenDe(s); if (o && s.destino) km += dist(o, s.destino); });

  return `<div class="row"><h1>${esc(k.nombre)}</h1><span class="spacer"></span><button class="btn" data-a="editar" data-tipo="cliente" data-id="${k.id}">Editar</button><button class="btn primary" data-a="nuevoSvcCliente" data-id="${k.id}">Nuevo servicio</button></div>

      <div class="stat"><b>${conHora ? nf(enPlazo / conHora * 100) + " %" : "—"}</b><span>Entregas previstas en plazo</span></div><div class="stat"><b>${nf(km)}</b><span>Km estimados con carga</span></div><div class="stat"><b>${eur(importe)}</b><span>Importe de los portes</span></div></div>
    <h2>Destinos del cliente</h2>
    ${dests.length ? `<div class="tw"><table><thead><tr><th>Destino</th><th>Localidad</th><th>Recepción</th><th>Acceso</th><th>Notas</th></tr></thead><tbody>${dests.map(d => `<tr><td><b>${esc(d.nombre)}</b></td><td>${esc(d.lugar?.nombre || "")}</td><td class="n">${esc(d.desde)}-${esc(d.hasta)}</td><td>${esc({ muelle: "Muelle de carga", calle: "Descarga en calle", restringido: "Acceso restringido a pesados" }[d.acceso] || d.acceso || "")}</td><td>${esc(d.notas || "")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Sin destinos guardados. Añádelos en Flota y personal › Destinos.</div>`}

  <section class="center"><div class="scroll">${msg()}${ui.flota === "empresa" ? pEmpresa() : ui.flota === "camiones" ? pCamiones() : ui.flota === "conductores" ? pConductores() : pDestinos()}</div></section>`;

function alertas() {
  const D = todayN(), out = [];
  const chk = (f, txt) => { if (!f) return; const n = dayNum(f) - D; if (n < 0) out.push({ n, cad: true, txt: `${txt} caducó el ${fechaCorta(f)}.` }); else if (n <= 30) out.push({ n, cad: false, txt: `${txt} vence el ${fechaCorta(f)} (en ${n} días).` }); };
  state.camiones.forEach(c => { chk(c.itv, `La ITV del ${c.matricula}`); chk(c.tarjeta, `La autorización de transporte del ${c.matricula}`); chk(c.atp, `El ATP del ${c.matricula}`); chk(c.adrCert, `El certificado ADR del ${c.matricula}`); });
  state.conductores.forEach(d => { chk(d.cadPermiso, `El permiso de ${d.nombre}`); chk(d.cadCAP, `El CAP de ${d.nombre}`); chk(d.cadADR, `La autorización ADR de ${d.nombre}`); chk(d.cadAnimales, `El certificado de animales de ${d.nombre}`); });

}

    pintarCargando("Cargando tus datos…");
    const ds = await datosRef().get();
    const d = ds.exists ? ds.data() : null;
    const lista = (d && Array.isArray(d.espacios) ? d.espacios : []).filter(x => x && x.id && x.nombre);
    if (!lista.some(x => x.id === "principal")) lista.unshift({ id: "principal", nombre: "Principal" });
    const actual = d && lista.some(x => x.id === d.actual) ? d.actual : "principal";
    ESP = { espacios: lista, actual };
    if (!ds.exists) await datosRef().set(ESP);
    const doc = await docRef(actual).get();
    const dd = doc.exists ? doc.data() : null;
    window.__NUBE = dd && typeof dd.json === "string" ? { json: dd.json, t: dd.actualizado || 0 } : null;
    window.__ESPACIO = actual;
    window.__LS_KEY = cacheKey(actual);
    const ira = ss.get(S_IRA); if (ira) { window.__IR_A = ira; ss.del(S_IRA); }
    let ajustes = {};
    try { const a = await col("ajustes").doc("rutas").get(); if (a.exists) ajustes = a.data() || {}; } catch (e) { /* reglas antiguas o sin conexión: sin rutas por carretera */ }
    window.__DP = api(ajustes);
    iniciado = true;
    app.innerHTML = "";
    window.__programaIncluida();
    montar();
    const aviso = ss.get(S_AVISO); if (aviso) { ss.del(S_AVISO); toast(aviso); }
  }

  function apSecundaria() {
    const ya = firebase.apps.find(a => a.name === "altas");
    return ya || firebase.initializeApp(window.FB_CONFIG, "altas");
  }
  let avisoInvalida = false;
  function api(ajustes) {
    return {
      usuario: { clave: perfil.clave, nombre: perfil.nombre, admin: perfil.admin },
      orsKey: (ajustes && typeof ajustes.orsKey === "string") ? ajustes.orsKey : "",
      async leerTramos(claves) {
        const out = {};
        await Promise.all(claves.map(async k => { const s = await col("tramos").doc(k).get(); if (s.exists) out[k] = s.data(); }));
        return out;
      },
      guardarTramos(filas) {
        const b = db.batch();
        Object.entries(filas).forEach(([k, v]) => b.set(col("tramos").doc(k), v, { merge: true }));
        return b.commit();
      },
      async guardarClaveRutas(k) {
        await col("ajustes").doc("rutas").set({ orsKey: k, actualizado: ahora() });
        this.orsKey = k;
      },
      textoError, validarClave,
      guardarDoc(json) {
        if (new Blob([json]).size > 1000000) return Promise.reject({ code: "dp/grande", dp: "Los datos de este espacio son demasiado grandes para guardarlos en la nube." });
        return docRef(window.__ESPACIO).set({ json, actualizado: ahora() });
      },
      async listarUsuarios() {
        const q = await col("usuarios").get();
        return q.docs.map(x => Object.assign({ clave: x.id }, x.data()));
      },
      aprobar: c => col("usuarios").doc(c).update({ estado: "aprobado", alta: ahora() }),
      async rechazar(c) { const b = db.batch(); b.delete(col("cuentas").doc(c)); b.delete(col("usuarios").doc(c)); await b.commit(); },
      async restablecer(c) {
        const s = await col("usuarios").doc(c).get(); if (!s.exists) throw { dp: "Ese usuario ya no existe." };
        const p = s.data(); if (p.admin) throw { dp: "La contraseña del administrador se cambia con «Cambiar mi contraseña»." };
        const sa = apSecundaria().auth();
        await sa.setPersistence(firebase.auth.Auth.Persistence.NONE);
        const email = nuevoEmail(c);
        const cred = await sa.createUserWithEmailAndPassword(email, p.nombre + SUF);
        const uid = cred.user.uid;
        await sa.signOut();
        const b = db.batch();
        b.update(col("cuentas").doc(c), { email });
        b.update(col("usuarios").doc(c), { uid, forzar: true });
        await b.commit();
      },
      async baja(c) {
        if (c === ADMIN_CLAVE) throw { dp: "No se puede dar de baja al administrador." };
        const dref = col("datos").doc(c), docs = await dref.collection("docs").get(), b = db.batch();
        docs.forEach(x => b.delete(x.ref));
        b.delete(dref); b.delete(col("usuarios").doc(c)); b.delete(col("cuentas").doc(c));
        await b.commit();
      },
      async cambiarClave(actual, nueva) {
        const u = auth.currentUser; if (!u) throw { dp: "La sesión ha caducado. Vuelve a entrar." };
        try { await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, actual + SUF)); }
        catch (e) { if (e && /credential|password|user-mismatch/.test(e.code || "")) throw { dp: "La contraseña actual no es correcta." }; throw e; }
        await u.updatePassword(nueva + SUF);
      },
      async salir() {
        if (window.__pararGuardado) window.__pararGuardado();
        limpiarCache();
        await auth.signOut().catch(() => {});
        ss.set(S_SALIDA, "1");
        reiniciar();
      },
      sesionInvalida() {
        if (avisoInvalida) return; avisoInvalida = true;
        toast("Tu sesión ya no es válida: la contraseña se ha restablecido o la cuenta se ha dado de baja. Vuelve a entrar.", "Volver a entrar", () => { if (window.__pararGuardado) window.__pararGuardado(); limpiarCache(); auth.signOut().catch(() => {}).then(reiniciar); });
      },
    };
  }

  async function arrancar() {
    pintarCargando("Conectando con la nube…");
    const cfg = window.FB_CONFIG;
    if (!cfg || typeof cfg !== "object" || !cfg.apiKey || !cfg.projectId || /PEGA|AQUI|TU_/i.test(cfg.apiKey + cfg.projectId)) { pintarSinConfig(); return; }
    if (!window.firebase || !firebase.initializeApp || !firebase.auth || !firebase.firestore) { pintarError("No se ha podido cargar Firebase. Comprueba la conexión a internet y que ninguna extensión del navegador bloquee los scripts de gstatic.com.", true); return; }
    try {
      if (!auth) { const fbApp = firebase.apps.find(a => a.name === "[DEFAULT]") || firebase.initializeApp(cfg); auth = fbApp.auth(); db = fbApp.firestore(); }
      const instalada = !!(window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
      await auth.setPersistence(instalada ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    } catch (e) { pintarError(textoError(e), true); return; }
    if (ss.get(S_SALIDA)) { ss.del(S_SALIDA); au.ok = "Has cerrado la sesión."; }
    const u = await new Promise(res => { const off = auth.onAuthStateChanged(x => { off(); res(x); }); });
    if (!u) { pintarAuth(); return; }
    try { await continuar(u, false); if (!iniciado) pintarAuth(); }
    catch (e) {
      if (e && e.dp) { au.err = e.dp; au.vista = "login"; pintarAuth(); }
      else pintarError(textoError(e), true);
    }
  }

  /* ------------------------------ panel ⚙ (espacios y copias) ------------------------------ */
  let panel = null, btn = null, lastFocus = null;
  const st = { msg: null, pendRest: null, confBorrar: null, ocupado: false };

  function montar() {
    btn = document.createElement("button");
    btn.id = "sh-btn"; btn.type = "button"; btn.setAttribute("aria-haspopup", "dialog");
    btn.innerHTML = "⚙ <span class=\"sh-long\">Espacios y copias · </span>v" + VERSION;
    btn.addEventListener("click", abrir);
    document.body.appendChild(btn);
    panel = document.createElement("div");
    panel.id = "sh-fondo"; panel.hidden = true;
    panel.addEventListener("click", clic);
    panel.addEventListener("change", cambio);
    panel.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });
    document.body.appendChild(panel);
  }
  function toast(t, acc, fn) {
    const d = document.createElement("div");
    d.className = "sh-toast"; d.setAttribute("role", "status");
    d.innerHTML = `<span>${esc(t)}</span>${acc ? `<button type="button" class="sh-acc">${esc(acc)}</button>` : ""}<button type="button" class="sh-cerrar" aria-label="Cerrar aviso">×</button>`;
    d.querySelector(".sh-cerrar").addEventListener("click", () => d.remove());
    if (acc) d.querySelector(".sh-acc").addEventListener("click", () => { d.remove(); fn(); });
    document.body.appendChild(d);
  }
  function abrir() { lastFocus = document.activeElement; st.msg = null; st.pendRest = null; st.confBorrar = null; panel.hidden = false; pintar(); const f = panel.querySelector("button, select, input"); if (f) f.focus(); }
  function cerrar() { if (st.ocupado) return; panel.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  const msg = (t, h) => { st.msg = { t, h }; pintar(); };

  function pintar() {
    const actual = ESP.espacios.find(x => x.id === ESP.actual);
    const m = st.msg ? `<div class="sh-msg ${st.msg.t}" role="status">${st.msg.h}</div>` : "";
    const dis = st.ocupado ? " disabled" : "";
    panel.innerHTML = `<div class="sh-panel" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <div class="sh-cab"><h2 id="sh-t">Espacios y copias</h2><button type="button" class="sh-x" data-sh="cerrar" aria-label="Cerrar">×</button></div>
      ${m}
      <p class="sh-nota" style="margin-top:8px">Sesión de <b>${esc(perfil.nombre)}</b> · Despacho de portes v${VERSION} en la nube. Todo se guarda en tu cuenta y lo encontrarás igual desde cualquier ordenador.</p>
      <section><h3>Espacios de trabajo</h3>
        <p class="sh-nota">Cada espacio tiene sus propios datos. Usa uno para el ejercicio base y otro para hacer pruebas sin tocarlo.</p>
        <div class="sh-fila"><label for="sh-sel">Espacio actual</label><select id="sh-sel" data-sh="cambiarEsp"${dis}>${ESP.espacios.map(x => `<option value="${esc(x.id)}" ${x.id === ESP.actual ? "selected" : ""}>${esc(x.nombre)}</option>`).join("")}</select>
          ${actual && actual.id !== "principal" ? `<button type="button" class="sh-btn2 sh-peli" data-sh="borrarEsp"${dis}>${st.confBorrar === actual.id ? "Pulsa otra vez para eliminar" : "Eliminar este espacio"}</button>` : ""}</div>
        <div class="sh-fila" style="margin-top:10px"><input id="sh-nom" type="text" maxlength="40" placeholder="Nombre del nuevo espacio" aria-label="Nombre del nuevo espacio"${dis}>
          <select id="sh-ori" aria-label="Datos iniciales"${dis}><option value="copia">Copia del espacio actual</option><option value="ejemplo">Datos de ejemplo</option><option value="vacio">Vacío</option>${EJERCICIO ? `<option value="act5">Actividad 5 (datos ya introducidos)</option>` : ""}</select>
          <button type="button" class="sh-btn2 sh-pri" data-sh="crearEsp"${dis}>Crear y abrir</button></div>
      </section>
      <section><h3>Copia de seguridad</h3>
        <p class="sh-nota">Descarga una copia en un archivo para guardarla o entregarla, o recupera una copia anterior.</p>
        <div class="sh-fila"><button type="button" class="sh-btn2" data-sh="exportar"${dis}>Descargar copia de «${esc(actual ? actual.nombre : "")}»</button><label class="sh-btn2" for="sh-f-rest">Restaurar copia…</label><input id="sh-f-rest" type="file" accept=".json,application/json" hidden${dis}></div>
        ${st.pendRest ? `<div class="sh-msg warn">La copia es del espacio «${esc(st.pendRest.espacio || "?")}»${st.pendRest.fecha ? " (" + esc(st.pendRest.fecha.slice(0, 10)) + ")" : ""}. Sustituirá los datos de «${esc(actual ? actual.nombre : "")}».<div class="sh-fila" style="margin-top:8px"><button type="button" class="sh-btn2 sh-peli" data-sh="restaurar"${dis}>Sustituir mis datos</button><button type="button" class="sh-btn2" data-sh="cancelarRest"${dis}>Cancelar</button></div></div>` : ""}
      </section></div>`;
    const g = panel.querySelector("#sh-f-rest"); if (g) g.addEventListener("change", () => leerArchivo(g, importarRest));
  }
  function leerArchivo(input, fn) {
    const f = input.files && input.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { input.value = ""; fn(String(r.result || "")); };
    r.onerror = () => { input.value = ""; msg("err", "No se ha podido leer el archivo."); };
    r.readAsText(f);
  }
  function importarRest(texto) {
    st.pendRest = null; let c = null;
    try { c = JSON.parse(texto); } catch (e) { msg("err", "El archivo no se puede leer: no es una copia válida."); return; }
    const d = c && c.formato === FORMATO_COPIA ? c.datos : c;
    if (!d || typeof d !== "object" || !Array.isArray(d.servicios) || !Array.isArray(d.camiones) || !Array.isArray(d.conductores) || !d.empresa) { msg("err", "El archivo no parece una copia de datos de este programa."); return; }
    st.msg = null; st.pendRest = { datos: d, espacio: c.formato === FORMATO_COPIA ? c.espacio : "", fecha: c.formato === FORMATO_COPIA ? c.fecha : "" }; pintar();
  }
  const vaciar = () => ({ version: 1, empresa: {}, clientes: [], destinos: [], camiones: [], conductores: [], servicios: [], asig: {} });
  function descargar(nombre, texto) {
    const b = new Blob([texto], { type: "application/json" }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  }
  const slug = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "espacio";

  async function ocupar(fn) {
    if (st.ocupado) return;
    st.ocupado = true; st.msg = { t: "", h: "Guardando en la nube…" }; pintar();
    try { await fn(); }
    catch (e) { st.ocupado = false; msg("err", esc(textoError(e))); return; }
    st.ocupado = false;
  }
  async function guardarAntes() { const ok = window.__guardarNube ? await window.__guardarNube() : true; if (!ok) throw { dp: "No se han podido subir tus últimos cambios a la nube. Comprueba la conexión y vuelve a intentarlo." }; }

  function cambio(e) {
    const el = e.target;
    if (el.dataset.sh === "cambiarEsp") {
      const id = el.value; if (id === ESP.actual) return;
      ocupar(async () => {
        await guardarAntes();
        await datosRef().set({ espacios: ESP.espacios, actual: id });
        if (window.__pararGuardado) window.__pararGuardado();
        reiniciar();
      });
    }
  }
  function clic(e) {
    if (e.target === panel) { cerrar(); return; }
    const el = e.target.closest("[data-sh]"); if (!el || el.tagName === "SELECT" || el.disabled) return;
    const a = el.dataset.sh;
    if (a === "cerrar") { cerrar(); return; }
    if (a === "cancelarRest") { st.pendRest = null; pintar(); return; }
    if (a === "exportar") {
      if (window.__guardarYa) window.__guardarYa();
      const esp = ESP.espacios.find(x => x.id === ESP.actual), raw = cacheJson(ESP.actual);
      if (!raw) { msg("warn", "Este espacio todavía no tiene datos guardados."); return; }
      let datos = null; try { datos = JSON.parse(raw); } catch (err) { msg("err", "No se han podido leer los datos de este espacio."); return; }
      const f = new Date().toISOString();
      descargar(`copia-${slug(perfil.nombre)}-${slug(esp.nombre)}-${f.slice(0, 10)}.json`, JSON.stringify({ formato: FORMATO_COPIA, espacio: esp.nombre, usuario: perfil.nombre, fecha: f, programa: VERSION, datos }));
      msg("ok", "Copia descargada."); return;
    }
    if (a === "restaurar") {
      const d = st.pendRest && st.pendRest.datos; if (!d) return;
      ocupar(async () => {
        if (window.__pararGuardado) window.__pararGuardado();
        await docRef(ESP.actual).set({ json: JSON.stringify(d), actualizado: ahora() });
        ss.del(cacheKey(ESP.actual));
        ss.set(S_AVISO, "Copia restaurada.");
        reiniciar();
      });
      return;
    }
    if (a === "crearEsp") {
      const nom = (panel.querySelector("#sh-nom").value || "").trim(), ori = panel.querySelector("#sh-ori").value;
      if (!nom) { msg("err", "Escribe un nombre para el nuevo espacio."); return; }
      if (ESP.espacios.some(x => x.nombre.toLowerCase() === nom.toLowerCase())) { msg("err", "Ya existe un espacio con ese nombre."); return; }
      const id = "e" + Date.now().toString(36);
      ocupar(async () => {
        await guardarAntes();
        let json = null;
        if (ori === "copia") json = cacheJson(ESP.actual);
        else if (ori === "vacio") json = JSON.stringify(vaciar());
        else if (ori === "act5" && EJERCICIO) json = JSON.stringify(EJERCICIO);
        if (json) await docRef(id).set({ json, actualizado: ahora() });
        await datosRef().set({ espacios: ESP.espacios.concat({ id, nombre: nom }), actual: id });
        if (ori === "act5") ss.set(S_IRA, "2026-11-17");
        if (window.__pararGuardado) window.__pararGuardado();
        reiniciar();
      });
      return;
    }
    if (a === "borrarEsp") {
      if (ESP.actual === "principal") return;
      if (st.confBorrar !== ESP.actual) { st.confBorrar = ESP.actual; pintar(); return; }
      ocupar(async () => {
        if (window.__pararGuardado) window.__pararGuardado();
        const id = ESP.actual;
        await docRef(id).delete();
        await datosRef().set({ espacios: ESP.espacios.filter(x => x.id !== id), actual: "principal" });
        ss.del(cacheKey(id));
        ss.set(S_AVISO, "Espacio eliminado.");
        reiniciar();
      });
    }
  }

  arrancar();
})();

</script>
<button type="button" id="dp-instalar" hidden>📲 Instalar la app</button>
<style>
#dp-instalar{position:fixed;right:12px;bottom:12px;z-index:45;border:0;background:#F2B200;color:#111;border-radius:999px;padding:9px 15px;font:700 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.3);cursor:pointer}
#dp-instalar[hidden]{display:none}
</style>
<script>
(function () {
  var ev = null, b = document.getElementById("dp-instalar");
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); ev = e; b.hidden = false; });
  b.addEventListener("click", function () { if (!ev) return; b.hidden = true; ev.prompt(); ev = null; });
  window.addEventListener("appinstalled", function () { b.hidden = true; });
  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
